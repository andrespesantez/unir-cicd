services:
  # Jenkins Server - Controlador principal
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-controller
    privileged: true
    user: root
    ports:
      - "8080:8080"     # Web UI
      - "50000:50000"   # Agent communication
    volumes:
      # Persistencia de datos de Jenkins
      - jenkins_home:/var/jenkins_home
      # Socket de Docker para Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Directorio del proyecto para acceso local
      - ../:/workspace
      # Script de inicialización para crear usuario admin
      - ./init-admin.groovy:/var/jenkins_home/init.groovy.d/init-admin.groovy
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx2048m -Xms512m
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - jenkins-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins-network:
    driver: bridge
